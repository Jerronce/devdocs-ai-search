<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevDocs AI Search</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#08111f;color:#f8fafc}main{max-width:1100px;margin:auto;padding:44px 20px}.badge{display:inline-block;padding:8px 12px;border-radius:999px;border:1px solid #ffffff22;color:#93c5fd;background:#ffffff0d;font-weight:800}h1{font-size:clamp(40px,7vw,72px);letter-spacing:-.06em;margin:16px 0;line-height:.95}p{color:#9fb0c7;font-size:18px;line-height:1.6}.card{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:28px;padding:22px;box-shadow:0 24px 80px #0007}input{width:100%;border:1px solid #334155;background:#020617;color:white;border-radius:18px;padding:16px;font-size:16px}.results{display:grid;gap:14px;margin-top:18px}.result{padding:18px;border-radius:20px;background:#020617;border:1px solid #1e293b}.tag{display:inline-block;color:#bfdbfe;background:#1d4ed822;border:1px solid #60a5fa44;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900}.summary{margin-top:18px;background:#052e1d;border:1px solid #22c55e44;color:#bbf7d0;border-radius:20px;padding:18px}</style></head><body><main><span class="badge">Developer Tool Demo</span><h1>DevDocs AI Search</h1><p>Search sample documentation snippets and generate a concise implementation summary.</p><section class="card"><input id="q" placeholder="Search docs e.g. auth, deploy, database" oninput="search()"><div class="results" id="results"></div><div class="summary" id="summary">Start typing to search the documentation knowledge base.</div></section></main><script>const docs=[{tag:'Auth',title:'Token Login',body:'Use token-based login for API requests. Store session state safely and refresh tokens before expiry.'},{tag:'Deploy',title:'Static Hosting',body:'Build the project, upload static files, configure custom domain, and enable HTTPS.'},{tag:'Database',title:'Indexes',body:'Add indexes to fields used in filters and sorting to improve query performance.'},{tag:'UI',title:'Loading States',body:'Show skeleton loaders and empty states so users understand what is happening.'}];function search(){const term=q.value.toLowerCase();const found=docs.filter(d=>(d.title+d.body+d.tag).toLowerCase().includes(term));results.innerHTML=(term?found:docs).map(d=>`<div class="result"><span class="tag">${d.tag}</span><h3>${d.title}</h3><p>${d.body}</p></div>`).join('');summary.textContent=term&&found.length?`Summary: ${found.length} documentation result(s) match "${term}". Review the top result and apply the implementation guidance.`:'Start typing to search the documentation knowledge base.'}search()</script></body></html>
